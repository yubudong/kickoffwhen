services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: family_learning_test
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d family_learning_test"]
      interval: 2s
      timeout: 2s
      retries: 20
