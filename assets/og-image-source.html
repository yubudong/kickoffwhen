<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1200, initial-scale=1" />
    <title>KickoffWhen OG Image Source</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0a1929;
      }

      canvas {
        display: block;
        width: 1200px;
        height: 630px;
      }
    </style>
  </head>
  <body>
    <canvas id="og" width="1200" height="630" aria-label="KickoffWhen social media card"></canvas>
    <script>
      const canvas = document.getElementById("og");
      const ctx = canvas.getContext("2d");
      const W = 1200;
      const H = 630;
      const fontStack =
        '-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif';

      function regularPolygon(cx, cy, radius, sides, rotation = -Math.PI / 2) {
        const points = [];
        for (let i = 0; i < sides; i += 1) {
          const angle = rotation + (Math.PI * 2 * i) / sides;
          points.push([cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius]);
        }
        return points;
      }

      function drawPolygon(points, fill, stroke = null, lineWidth = 1) {
        ctx.beginPath();
        points.forEach(([x, y], index) => {
          if (index === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.closePath();
        if (fill) {
          ctx.fillStyle = fill;
          ctx.fill();
        }
        if (stroke) {
          ctx.strokeStyle = stroke;
          ctx.lineWidth = lineWidth;
          ctx.lineJoin = "miter";
          ctx.stroke();
        }
      }

      function drawTrackedText(text, x, y, tracking) {
        let cursor = x;
        for (const char of text) {
          ctx.fillText(char, cursor, y);
          cursor += ctx.measureText(char).width + tracking;
        }
      }

      function drawBackground() {
        ctx.fillStyle = "#0A1929";
        ctx.fillRect(0, 0, W, H);

        const glow = ctx.createRadialGradient(1015, 65, 0, 1015, 65, 520);
        glow.addColorStop(0, "#0F2438");
        glow.addColorStop(0.34, "#0B1C2D");
        glow.addColorStop(0.76, "#0A1929");
        glow.addColorStop(1, "#0A1929");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, W, H);
      }

      function drawText() {
        const x = 88;

        ctx.textBaseline = "alphabetic";
        ctx.font = `800 92px ${fontStack}`;
        ctx.fillStyle = "#F8FAFC";
        ctx.fillText("Kickoff", x, 162);
        const kickoffWidth = ctx.measureText("Kickoff").width;
        ctx.fillStyle = "#FFD600";
        ctx.fillText("When", x + kickoffWidth, 162);

        ctx.font = `600 40px ${fontStack}`;
        ctx.fillStyle = "#F8FAFC";
        ctx.fillText("2026 World Cup · Local kickoff times", x, 242);

        ctx.fillStyle = "#00C853";
        ctx.fillRect(x, 276, 360, 4);

        ctx.font = `500 30px ${fontStack}`;
        ctx.fillStyle = "#9FB2CA";
        drawTrackedText("JST  ·  KST  ·  CST  ·  SGT  ·  HKT", x, 348, 3.2);
      }

      function drawMoon() {
        const layer = document.createElement("canvas");
        layer.width = W;
        layer.height = H;
        const moon = layer.getContext("2d");

        moon.fillStyle = "#FFD600";
        moon.beginPath();
        moon.arc(950, 315, 190, 0, Math.PI * 2);
        moon.fill();

        moon.globalCompositeOperation = "destination-out";
        moon.beginPath();
        moon.arc(875, 315, 178, 0, Math.PI * 2);
        moon.fill();

        ctx.drawImage(layer, 0, 0);
      }

      function drawBallShadow(cx, cy, r) {
        ctx.save();
        ctx.filter = "blur(10px)";
        ctx.globalAlpha = 0.2;
        ctx.fillStyle = "#02070C";
        ctx.beginPath();
        ctx.ellipse(cx + 7, cy + r + 11, r * 0.82, 18, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawSoccerBall(cx, cy, r) {
        const black = "#05080B";
        const outline = "#05080B";

        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.clip();

        ctx.fillStyle = "#F8FAFC";
        ctx.fillRect(cx - r, cy - r, r * 2, r * 2);

        ctx.strokeStyle = outline;
        ctx.lineWidth = 4;
        ctx.lineCap = "round";
        ctx.lineJoin = "miter";

        const centerPentagon = regularPolygon(cx, cy - 3, r * 0.29, 5, -Math.PI / 2);
        const outerAngles = [-90, -18, 54, 126, 198].map((deg) => (deg * Math.PI) / 180);
        const outerPentagons = outerAngles.map((angle) => {
          const px = cx + Math.cos(angle) * r * 0.64;
          const py = cy + Math.sin(angle) * r * 0.64;
          return regularPolygon(px, py, r * 0.23, 5, angle + Math.PI / 5);
        });

        ctx.beginPath();
        centerPentagon.forEach(([x1, y1], index) => {
          const [x2, y2] = outerPentagons[index][2];
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
        });
        outerPentagons.forEach((pentagon, index) => {
          const next = outerPentagons[(index + 1) % outerPentagons.length];
          const [x1, y1] = pentagon[4];
          const [x2, y2] = next[1];
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
        });
        ctx.stroke();

        drawPolygon(centerPentagon, black);
        outerPentagons.forEach((pentagon) => drawPolygon(pentagon, black));

        ctx.restore();

        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.strokeStyle = outline;
        ctx.lineWidth = 4;
        ctx.stroke();
      }

      async function render() {
        await document.fonts.ready;
        drawBackground();
        drawText();
        drawMoon();
        drawBallShadow(834, 341, 92);
        drawSoccerBall(834, 341, 92);
      }

      window.renderDone = render().then(() => {
        window.pngDataUrl = canvas.toDataURL("image/png");
      });
    </script>
  </body>
</html>
